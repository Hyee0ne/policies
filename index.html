<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정책 페이지</title>
<meta name="description" content="앱 개인정보처리방침 및 정책 페이지 모음.">
<style>
  :root { --bg:#fff; --fg:#1c1c1e; --muted:#6b6b70; --line:#e5e5ea; --accent:#ff7a1a; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0f0f11; --fg:#ececef; --muted:#9a9aa2; --line:#2a2a2e; --accent:#ff9445; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); line-height:1.7;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:56px 20px; }
  h1 { font-size:1.6rem; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 28px; }
  ul { list-style:none; padding:0; margin:0; }
  li { border-top:1px solid var(--line); }
  a { display:block; padding:16px 4px; color:var(--fg); text-decoration:none; font-weight:600; }
  a:hover { color:var(--accent); }
  .sub { display:block; font-weight:400; font-size:0.9rem; color:var(--muted); margin-top:2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>정책 페이지</h1>
  <p>앱별 개인정보처리방침 및 정책 문서입니다.</p>
  <ul>
    <li>
      <a href="./brrrp/">Brrrp — 개인정보처리방침
        <span class="sub">표정 인식 기상 알람 · 얼굴 데이터 온디바이스 처리, 저장·전송 없음</span>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
